name: "Release torch-ttnn-shutov (fork, no HW runners)"
run-name: "Release torch-ttnn-shutov (${{ inputs.wheel_type }} -> ${{ inputs.publish_target }})"

# Fork-adapted from build-test-release-wheel.yaml:
# - runs-on: ubuntu-latest (GitHub-hosted). Self-hosted label ttnn-big is empty on this fork.
# - public tt-metal CI container (same image as run-cpp-native-tests.yaml)
# - no Tenstorrent hardware mounts (/dev/tenstorrent, hugepages NFS cache)
# - distribution name: torch-ttnn-shutov (import package stays torch_ttnn)
# - publish: workflow_dispatch with wheel_type=release only, explicitly choosing TestPyPI or PyPI
# - Matched eager path: submodule pin 8dfb324 + ttnn-shutov==0.65.0.dev20251204

on:
  workflow_dispatch:
    inputs:
      wheel_type:
        description: "pre-release builds wheel artifact only; release also publishes to the selected index"
        required: true
        default: pre-release
        type: choice
        options:
          - pre-release
          - release
      publish_target:
        description: "Package index for release uploads; ignored for pre-release artifact-only runs"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      isolate_soname:
        description: "SONAME isolation (interim for mismatched runtime). Off for matched ttnn-shutov from pin 8dfb324."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-wheel:
    # GitHub-hosted only — ttnn-big / TT harbor runners are not available on this fork.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/tt-metal/tt-metalium/ubuntu-22.04-ci-test-amd64@sha256:104b062b1942b398902884d6340a9695fbfcd4ffe6fb5a59f3d6363c499e7fce
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --rm
        -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }}
        -v /:/host
    env:
      CCACHE_DIR: /tmp/ccache
      CPM_SOURCE_CACHE: /tmp/cpm
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      PYTHON_ENV_DIR: ${{ github.workspace }}/torch_ttnn/cpp_extension/third-party/tt-metal/python_env
      TT_METAL_HOME: ${{ github.workspace }}/torch_ttnn/cpp_extension/third-party/tt-metal
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk on host (via /host mount)
        run: |
          set -euxo pipefail
          df -h / /host || true
          rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc \
            /host/usr/local/share/powershell /host/usr/share/swift /host/usr/local/.ghcup \
            /host/opt/hostedtoolcache/CodeQL || true
          # Drop unused docker images on the host if docker CLI is present
          docker system prune -af || true
          df -h / /host || true

      - name: Fix apt repository keys
        run: |
          set -euxo pipefail
          rm -f /etc/apt/sources.list.d/kitware.list 2>/dev/null || true

      - name: Prepare checkout
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y git-lfs
          git lfs install

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          submodules: recursive
          clean: true

      - name: Configure git safe directories
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory '*'

      - name: Initialize git submodules
        run: |
          set -euxo pipefail
          git submodule update --init --recursive

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-shutov-release-${{ runner.os }}-${{ hashFiles('torch_ttnn/cpp_extension/**/*.cpp', 'torch_ttnn/cpp_extension/**/*.hpp', 'VERSION') }}
          restore-keys: |
            ccache-shutov-release-${{ runner.os }}-

      - name: Configure ccache
        run: |
          set -euxo pipefail
          mkdir -p "${CCACHE_DIR}"
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --set-config=base_dir="${CCACHE_BASEDIR}"
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Install TT-Metal system dependencies
        run: |
          set -euxo pipefail
          cd torch_ttnn/cpp_extension/third-party/tt-metal
          ./install_dependencies.sh

      - name: Build C++ extension (includes tt-metal build)
        env:
          VERBOSE: "1"
          CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON"
        run: |
          set -euxo pipefail
          bash torch_ttnn/cpp_extension/build_cpp_extension.sh Release
          ccache --show-stats

      - name: Build torch-ttnn-shutov wheel
        run: |
          set -euxo pipefail
          source torch_ttnn/cpp_extension/third-party/tt-metal/python_env/bin/activate
          python3 -m pip install --upgrade build "scikit-build-core>=0.10,<0.11" wheel
          rm -rf dist/
          python3 -m build --wheel --no-isolation
          ls -lh dist/
          test -f VERSION
          echo "Built from commit: $(git rev-parse HEAD)"
          echo "Distribution: torch-ttnn-shutov $(cat VERSION)"

      - name: Repair wheel platform tag for PyPI
        run: |
          set -euxo pipefail
          source torch_ttnn/cpp_extension/third-party/tt-metal/python_env/bin/activate
          apt-get update
          apt-get install -y patchelf
          python3 -m pip install --upgrade auditwheel twine
          mkdir -p wheelhouse
          WHEEL_FILE=$(ls -1 dist/*.whl | head -n 1)
          auditwheel repair \
            --plat manylinux_2_35_x86_64 \
            --exclude libtorch_cpu.so \
            --exclude libtorch.so \
            --exclude libtorch_python.so \
            --exclude libc10.so \
            -w wheelhouse \
            "${WHEEL_FILE}"
          rm -f dist/*.whl
          mv wheelhouse/*.whl dist/
          ls -lh dist/
          twine check dist/*.whl

      - name: Isolate bundled _ttnncpp SONAME in wheel
        if: ${{ github.event.inputs.isolate_soname == 'true' }}
        run: |
          set -euxo pipefail
          source torch_ttnn/cpp_extension/third-party/tt-metal/python_env/bin/activate
          python3 -m pip install --upgrade wheel
          WHEEL_FILE=$(ls -1 dist/*.whl | head -n 1)
          UNPACK_DIR=$(mktemp -d)
          python3 -m wheel unpack "${WHEEL_FILE}" -d "${UNPACK_DIR}"
          WHEEL_TREE=$(find "${UNPACK_DIR}" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          python3 tools/isolate_ttnncpp_soname.py "${WHEEL_TREE}"
          ISOLATED_WHEEL=$(python3 -m wheel pack "${WHEEL_TREE}" -d dist/ | awk '{print $NF}')
          rm -f dist/*.whl
          mv "${ISOLATED_WHEEL}" dist/
          ls -lh dist/
          twine check dist/*.whl

      - name: ABI / linking report
        continue-on-error: true
        run: |
          set -euxo pipefail
          source torch_ttnn/cpp_extension/third-party/tt-metal/python_env/bin/activate
          WHEEL_FILE=$(ls -1 dist/*.whl | head -n 1)
          {
            echo "wheel=${WHEEL_FILE}"
            echo "tt-metal=$(git -C torch_ttnn/cpp_extension/third-party/tt-metal rev-parse HEAD)"
            if [[ -f tools/report_wheel_abi.py ]]; then
              python3 tools/report_wheel_abi.py "${WHEEL_FILE}" \
                --tt-metal-dir torch_ttnn/cpp_extension/third-party/tt-metal \
                --output /dev/stdout
            else
              echo "tools/report_wheel_abi.py missing; skipped detailed ABI dump"
              unzip -l "${WHEEL_FILE}" | awk '/\.so($|\.)/ {print $NF}' | head -40
            fi
          } | tee abi-report.txt

      - name: Upload ABI report
        uses: actions/upload-artifact@v4
        with:
          name: abi-report
          path: abi-report.txt

      - name: Test wheel installation (pair-smoke)
        run: |
          set -euxo pipefail
          source torch_ttnn/cpp_extension/third-party/tt-metal/python_env/bin/activate
          python3 -m pip uninstall -y torch-ttnn-shutov torch-ttnn ttnn-shutov ttnn || true
          WHEEL_FILE=$(ls -1 dist/*shutov*.whl 2>/dev/null || ls -1 dist/*.whl | head -n 1)
          if [[ "${{ github.event.inputs.publish_target || 'testpypi' }}" == "testpypi" ]]; then
            python3 -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "${WHEEL_FILE}[pypi]"
          else
            python3 -m pip install "${WHEEL_FILE}[pypi]"
          fi
          python3 -c "import torch_ttnn; print('IMPORT OK:', torch_ttnn.__file__)"
          python3 -c "import ttnn; print('TTNN OK:', ttnn.__file__)"
          # Load the C++ extension alongside the ttnn runtime: this is the path that
          # regressed on PyPI (SONAME clash) and was never covered by import-only smoke.
          # as_torch_device is the matched-eager ABI gate for end users.
          python3 -c "import torch_ttnn; from torch_ttnn.cpp_extension import ttnn_module; print('CPP EXT OK:', getattr(ttnn_module,'__file__',ttnn_module)); assert hasattr(ttnn_module,'as_torch_device'), dir(ttnn_module); print('AS_TORCH_DEVICE_OK:', ttnn_module.as_torch_device); print('PAIR_SMOKE_OK')"


      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: torch-ttnn-shutov-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish torch-ttnn-shutov to TestPyPI
    needs: [build-wheel]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.wheel_type == 'release' && github.event.inputs.publish_target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/torch-ttnn-shutov
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: torch-ttnn-shutov-distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}

  publish-to-pypi:
    name: Publish torch-ttnn-shutov to PyPI
    needs: [build-wheel]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.wheel_type == 'release' && github.event.inputs.publish_target == 'pypi' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torch-ttnn-shutov
    permissions:
      id-token: write
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: torch-ttnn-shutov-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
